services:
  postgres:
    image: postgres:16-alpine
    container_name: mentify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mentify}
      POSTGRES_USER: ${DB_USERNAME:-mentify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mentify_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mentify-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mentify} -d ${DB_NAME:-mentify}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mentify-postgres-data:
