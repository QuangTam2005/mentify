spring:
  application:
    name: mentify-be
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mentify}
    username: ${DB_USERNAME:mentify}
    password: ${DB_PASSWORD:mentify_local}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Standard Spring Mail properties are intentionally configurable only through
  # environment variables; local development keeps mail delivery disabled.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: 8080

app:
  security:
    jwt:
      enabled: ${JWT_ENABLED:true}
      issuer: ${JWT_ISSUER:mentify-be}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    oauth2:
      google:
        enabled: ${GOOGLE_OAUTH_ENABLED:false}
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/auth/callback}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@mentify.vn}
    base-url: ${MAIL_BASE_URL:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
